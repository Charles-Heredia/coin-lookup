, and resell well below retail. Not magnetic: one that sticks is plated steel.'],["Magnet test","Is copper magnetic? Is silver or gold magnetic?","No. Copper, silver and gold are not magnetic (all three are weakly diamagnetic), so a genuine silver or gold coin, bar or round, or a copper cent, never sticks to a magnet. If it sticks, it contains iron, steel or nickel: a plated-steel fake, or a coin that is meant to stick (1943 steel cents; Canadian pure-nickel and post-2000 plated-steel coins). US nickels (75% copper) do not stick. Slide test: a strong neodymium magnet slides slowly down a tilted silver coin or bar (eddy-current drag); a fast slide points to a non-silver core. Passing is not proof: tungsten, lead, brass and copper-core fakes are non-magnetic too, so also weigh (0.01 g), measure, ping and use a Sigma PMV."],["Raw nuggets","Purity and melt","Natural gold and silver nuggets are not automatically pure. Rock and dirt add gross weight. Until an assay, purity is unknown. Melt is scale grams times an assumed purity, divided by 31.1034768, times spot. It is not an appraisal, a dealer bid, or a nugget premium. Refining and resale prices can differ."],["Sigma PMV",'Electronic metal verifier \xB7 Sigma tester ("signs tester")',"Sigma Metalytics Precious Metal Verifier. It sends a tiny electromagnetic field into the coin or bar (through it, not just the surface) and compares the metal's resistivity with the setting you pick. Good at catching plated fakes and tungsten-core bars within its reading depth (Sigma: up to 12.5 mm on current onboard sensors; optional External Bridge for thick bars up to 45 mm). Limits: needs the right sensor or wand for the size; plating thicker than the reading depth can pass; alloys with similar resistivity can fool it; it doesn't confirm exact purity, grade, or collector value. Pair with weight, size, magnet and ping test."],["Grading costs (2026)","PCGS / NGC submission fees","PCGS membership $69/yr; Modern Value $17 (1965+, \u2264$300), Economy $24 (\u2264$300), Regular $42 (\u2264$3,000), Express $70; +$10 handling + shipping. NGC Associate $39/yr (free tier); Modern $20, Economy $25 (\u2264$300, ~60 working days), Standard $45, Express $80. Rule of thumb: grade only when slabbed beats raw by >~$50; dealer bulk can be cheaper."],["#1 PCGS","Professional Coin Grading Service","Pro: highest resale premiums, deepest price data. Con: slower, pricier submissions."],["#2 NGC","Numismatic Guaranty Company","Pro: near-PCGS liquidity, top for world/modern coins. Con: often a small discount to PCGS on classic US."],["#3 CACG","CAC Grading","Pro: strict, conservative grades. Con: newer (2023), smaller market and price history."],["#4 ANACS","American Numismatic Association Certification Service","Pro: oldest service, good on varieties/errors. Con: sells below PCGS/NGC for the same grade."],["#5 ICG","Independent Coin Graders","Pro: cheap, acceptable on moderns. Con: weak premiums; dealers often regrade."],["#6 No-name (e.g. SGS)","Unrecognized slabbers","Pro: none worth paying for. Con: grades often inflated; value it as raw."],["CAC sticker","On PCGS/NGC holders","A green (or gold) CAC sticker on a PCGS/NGC coin adds value: it confirms quality for the grade."],["P1\u2013AG3","Sheldon scale, low end","1-70 scale. P1 Poor (barely identifiable), FR2 Fair, AG3 About Good (rims worn into letters)"],["G 4\u20136","Good","Heavy wear; outline and date clear, rims mostly full"],["VG 8\u201310","Very Good","Well worn; some inner detail (e.g. part of LIBERTY) shows"],["F 12\u201315","Fine","Moderate even wear; all major design visible"],["VF 20\u201335","Very Fine","Moderate wear; major details clear"],["XF 40\u201345","Extremely Fine","Light wear on high points only"],["AU 50\u201358","About Uncirculated","Trace wear, most luster left"],["MS 60\u201370","Mint State","No wear; number reflects marks and luster. MS70 = no flaws at 5\xD7 magnification"],["BU","Brilliant Uncirculated","Never circulated, full original luster. Dealer term, not a formal grade; roughly MS60\u201365. How raw bullion is sold"],["Cull","Cull","Damaged or worn below AG3; worth melt or face. Bulk junk lots are often culls"],["+ / \u2605","Plus and star grades","+ (PCGS, NGC): high end of the grade. \u2605 (NGC): exceptional eye appeal. Both bring premiums"],["PCGS \xB7 NGC","Top-tier graders: Professional Coin Grading Service \xB7 Numismatic Guaranty Company","PCGS (1986) and NGC (1987) set the market; their slabs sell highest. Check every cert number on their site"],["CACG","CAC Grading (Certified Acceptance Corporation Grading)","CAC's own grading service (2023), conservative; treated as top tier"],["CAC","Certified Acceptance Corporation sticker (green bean)","Green: solid for the grade. Gold: could grade higher. Both add premiums."],["ANACS \xB7 ICG","Second-tier graders: American Numismatic Association Certification Service \xB7 Independent Coin Graders","Legit and older (ANACS 1972) but less consistent; sell below PCGS/NGC at the same grade"],["SGS etc.","No-name slabs","Off-brand holders (SGS and similar) often overgrade or hold fakes. Fake PCGS/NGC slabs exist: verify cert, holder and photo. Value the coin as raw"],["First Strike / Early Releases","PCGS FS \xB7 NGC ER labels","PCGS First Strike (FS) and NGC Early Releases (ER) mean the coin was submitted within the first 30 days of release; same dies and quality as later coins. A marketing label with a small premium on modern bullion (e.g. ASEs) that often doesn't hold on resale \u2014 value it like the same grade without the label."],["FDOI","First Day of Issue","NGC/PCGS label for coins bought on release day. Premium is label-driven; fades over time"],["PR / PF","Proof","Specially struck on polished dies: mirror fields, frosted devices. Graded PR/PF 60\u201370"],["DCAM","Cameo / Deep (Ultra) Cameo","Proof frost contrast: CAM moderate, DCAM (PCGS) / UCAM (NGC) strongest; big premium on older proofs"],["RP","Reverse Proof","Opposite of a normal p
