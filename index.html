cally pure. Rock and dirt add gross weight. Until an assay, purity is unknown. Melt is scale grams times an assumed purity, divided by 31.1034768, times spot. It is not an appraisal, a dealer bid, or a nugget premium. Refining and resale prices can differ."],["Sigma PMV",'Electronic metal verifier \xB7 Sigma tester ("signs tester")',"Sigma Metalytics Precious Metal Verifier. It sends a tiny electromagnetic field into the coin or bar (through it, not just the surface) and compares the metal's resistivity with the setting you pick. Good at catching plated fakes and tungsten-core bars within its reading depth (Sigma: up to 12.5 mm on current onboard sensors; optional External Bridge for thick bars up to 45 mm). Limits: needs the right sensor or wand for the size; plating thicker than the reading depth can pass; alloys with similar resistivity can fool it; it doesn't confirm exact purity, grade, or collector value. Pair with weight, size, magnet and ping test."],["Grading costs (2026)","PCGS / NGC submission fees","PCGS membership $69/yr; Modern Value $17 (1965+, \u2264$300), Economy $24 (\u2264$300), Regular $42 (\u2264$3,000), Express $70; +$10 handling + shipping. NGC Associate $39/yr (free tier); Modern $20, Economy $25 (\u2264$300, ~60 working days), Standard $45, Express $80. Rule of thumb: grade only when slabbed beats raw by >~$50; dealer bulk can be cheaper."],["#1 PCGS","Professional Coin Grading Service","Pro: highest resale premiums, deepest price data. Con: slower, pricier submissions."],["#2 NGC","Numismatic Guaranty Company","Pro: near-PCGS liquidity, top for world/modern coins. Con: often a small discount to PCGS on classic US."],["#3 CACG","CAC Grading","Pro: strict, conservative grades. Con: newer (2023), smaller market and price history."],["#4 ANACS","American Numismatic Association Certification Service","Pro: oldest service, good on varieties/errors. Con: sells below PCGS/NGC for the same grade."],["#5 ICG","Independent Coin Graders","Pro: cheap, acceptable on moderns. Con: weak premiums; dealers often regrade."],["#6 No-name (e.g. SGS)","Unrecognized slabbers","Pro: none worth paying for. Con: grades often inflated; value it as raw."],["CAC sticker","On PCGS/NGC holders","A green (or gold) CAC sticker on a PCGS/NGC coin adds value: it confirms quality for the grade."],["P1\u2013AG3","Sheldon scale, low end","1-70 scale. P1 Poor (barely identifiable), FR2 Fair, AG3 About Good (rims worn into letters)"],["G 4\u20136","Good","Heavy wear; outline and date clear, rims mostly full"],["VG 8\u201310","Very Good","Well worn; some inner detail (e.g. part of LIBERTY) shows"],["F 12\u201315","Fine","Moderate even wear; all major design visible"],["VF 20\u201335","Very Fine","Moderate wear; major details clear"],["XF 40\u201345","Extremely Fine","Light wear on high points only"],["AU 50\u201358","About Uncirculated","Trace wear, most luster left"],["MS 60\u201370","Mint State","No wear; number reflects marks and luster. MS70 = no flaws at 5\xD7 magnification"],["BU","Brilliant Uncirculated","Never circulated, full original luster. Dealer term, not a formal grade; roughly MS60\u201365. How raw bullion is sold"],["Cull","Cull","Damaged or worn below AG3; worth melt or face. Bulk junk lots are often culls"],["+ / \u2605","Plus and star grades","+ (PCGS, NGC): high end of the grade. \u2605 (NGC): exceptional eye appeal. Both bring premiums"],["PCGS \xB7 NGC","Top-tier graders: Professional Coin Grading Service \xB7 Numismatic Guaranty Company","PCGS (1986) and NGC (1987) set the market; their slabs sell highest. Check every cert number on their site"],["CACG","CAC Grading (Certified Acceptance Corporation Grading)","CAC's own grading service (2023), conservative; treated as top tier"],["CAC","Certified Acceptance Corporation sticker (green bean)","Green: solid for the grade. Gold: could grade higher. Both add premiums."],["ANACS \xB7 ICG","Second-tier graders: American Numismatic Association Certification Service \xB7 Independent Coin Graders","Legit and older (ANACS 1972) but less consistent; sell below PCGS/NGC at the same grade"],["SGS etc.","No-name slabs","Off-brand holders (SGS and similar) often overgrade or hold fakes. Fake PCGS/NGC slabs exist: verify cert, holder and photo. Value the coin as raw"],["First Strike / Early Releases","PCGS FS \xB7 NGC ER labels","PCGS First Strike (FS) and NGC Early Releases (ER) mean the coin was submitted within the first 30 days of release; same dies and quality as later coins. A marketing label with a small premium on modern bullion (e.g. ASEs) that often doesn't hold on resale \u2014 value it like the same grade without the label."],["FDOI","First Day of Issue","NGC/PCGS label for coins bought on release day. Premium is label-driven; fades over time"],["PR / PF","Proof","Specially struck on polished dies: mirror fields, frosted devices. Graded PR/PF 60\u201370"],["DCAM","Cameo / Deep (Ultra) Cameo","Proof frost contrast: CAM moderate, DCAM (PCGS) / UCAM (NGC) strongest; big premium on older proofs"],["RP","Reverse Proof","Opposite of a normal proof: frosted fields with mirrored devices (normal proof = mirror fields, frosted devices). Small special-set issues \u2014 e.g. ASE reverse proofs 2006-P, 2011-P, 2013-W Enhanced, 2019-S, 2021 Type-1/Type-2 (verify exact set packaging). Also 2020-W reverse-proof nickel in the silver set."],["PL \xB7 DMPL","Proof-like / Deep Mirror PL","Business strike with mirrored fields; mostly Morgans. DMPL = deep mirrors; strong premium"],["W burnished","Burnished (Uncirculated)","Mint's collector unc on burnished blanks, W mint mark, satin finish (ASE, AGE). Graded MS, not proof"],["Enhanced","Enhanced finish","Mixed frosted/polished finishes: Enhanced Unc (2013-W ASE), Enhanced Reverse Proof (2019-S/W ASE)"],["Details","Details grade","Cleaned, polished, environmental damage, scratched, holed, bent, PVC, altered surface. Sells well below a number grade"],["RD \xB7 RB \xB7 BN","Copper color","Red (95%+ original red), Red-Brown (5\u201395%), Brown (under 5%). RD brings the most"],["FB","Full Bands","Mercury and Roosevelt dimes: bands on the torch fully split. Big premium on Mercs"],["FBL","Full Bell Lines","Franklin halves: lower bell lines complete"],["FH","Full Head","Standing Liberty quarters: full helmet detail"],["FS (nickel)","Full Steps","Jefferson nickels: 5 or 6 complete Monticello steps (5FS / 6FS)"],["Key date","Key date","The scarce, expensive dates that make a set hard (and costly) to finish \u2014 low mintage and/or few survivors. Examples: 1909-S VDB cent, 1916-D Mercury, 1885 V nickel, 1912-S V nickel."],["Semi-key","Semi-key","Better-than-common dates with a premium, but not the stoppers. Examples: many mid-mintage S-mints; 1883 With CENTS V nickel is often called a semi-key (verify \u2014 No CENTS was heavily saved)."],["Rounds vs coins","Generic rounds vs legal-tender coins","A round (e.g. CNT .9999 Buffalo round) is private bullion: no year required as a mint date of issue for tender, no denomination, not legal tender. Coins (ASE, Maple, Eagle) have face value and usually trade at a higher premium. Generics bid near spot; branded/vintage rounds can bring more."],["Die rotation","Die rotation / rotated reverse","One die was locked turned out of alignment. U.S. coins use coin alignment: flip top-to-bottom and the reverse is upside-down. Small rotations are common and usually add little; about 90\xB0 or more can be collectible (verify). Not the same as an off-center strike."],["Whatnot premiums","Why Whatnot asks more than sold/melt","Live asks often run above sold comps or melt because: platform fees (~8%+) plus card processing; shipping and supplies; live-auction FOMO; asking price is not the sold price; and raw coins pitched at optimistic grades. Use this app Bid cap (common) and grade columns as a ceiling \u2014 walk when the ask beats sold comps after fees and shipping."],["Toning","Toning","Natural color from age. Attractive original toning can add val ly by routine; the timestamp shows when. Melt = weight (g) \xD7 fineness \xF7 31.1035 \xD7 spot."],badges:["Badges","Key: hardest, most valuable dates (low mintage or heavy melting). Semi: scarcer than common, well below keys; often cheap worn, pricey in mint state. Better: a bit scarcer, modest premium. Var: die variety (overdate, doubled die, mint-mark style) worth more than the normal coin. Verify: price data is thin or conflicting (few sales, missing grade, raw above graded); check recent sales before relying on it. '\xD7 common' = price vs. the series median. Sellers often call any old coin a key date; if it isn't marked Key or Semi here, pay common-date prices."],vals:["Series values","Mintages from USA Coin Book series tables. Values are PriceCharting sold-price guide columns (Ungraded as worn, AU, MS62, MS64) pulled Nov 2, 2026; blank means no PriceCharting entry for that date or variety. Empty columns are hidden."],bulk:["Bulk units","oz = avoirdupois (28.35 g), what kitchen/postal scales and sellers use. Troy oz (31.1 g) gives ~10% more coins. Subtract bags/rolls/tubes before converting. Steel 1943s (2.70 g) and Memorial cents mixed in skew counts and lower value; 1909-39 date lots sell ~3\xD7 higher."],wheat:["How bulk is valued","Every type gets an est. number (Nov 10, 2026). Silver types (90%, 40%, war nickels): silver melt at the live spot above; 90% junk trades near melt. Morgan/Peace: common circulated dealer asks $46.72 (JM Bullion Peace VG-XF) to $55.30 (APMEX Morgan VG-VF) each. Wheat cents: eBay sold 1 lb unsearched $17.45 + $9.95 ship (Jan 17, 2026) to ~$27.40/lb; 1,000-wheat asks $89.95 (~9\xA2/coin). Buffalo nickels (no precious metal; 75% copper/25% nickel metal is only ~7\xA2): mixed/unsearched 20-50\xA2 each, mid 35\xA2 (203 mixed sold $40 = 20\xA2, Collectors Universe Sep 2026; 100-coin no-date lots selling $35-50 on eBay per the same Sep 2026 post = 35-50\xA2; no-date rolls of 40 $8 Nickel Trader to $19.95 Great American Coin = 20-50\xA2;
